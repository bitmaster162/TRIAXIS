name: R8-H Direct AtCoder Public Statements

on:
  push:
    branches:
      - 'research/decision-closure-ebd-v0.3'
    paths:
      - '.github/workflows/r8-router-materialize.yml'

permissions:
  contents: read

jobs:
  public-statements:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Frozen source policy
        run: |
          echo 'R8H_DIRECT_SOURCE=1'
          echo 'SEARCH_ENGINE=DENY'
          echo 'EDITORIAL_ENDPOINTS=DENY'
          echo 'TASKS=abc391_d,abc338_b,abc357_b'
      - name: Fetch exact official task URLs
        run: |
          set -euo pipefail
          mkdir pages
          curl --fail --location --retry 3 --output pages/abc391_d.html 'https://atcoder.jp/contests/abc391/tasks/abc391_d?lang=en'
          curl --fail --location --retry 3 --output pages/abc338_b.html 'https://atcoder.jp/contests/abc338/tasks/abc338_b?lang=en'
          curl --fail --location --retry 3 --output pages/abc357_b.html 'https://atcoder.jp/contests/abc357/tasks/abc357_b?lang=en'
          sha256sum pages/*.html
      - name: Extract public English statements only
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet 'beautifulsoup4==4.13.4'
          python3 - <<'PY'
          from bs4 import BeautifulSoup
          import json, pathlib
          out=[]
          for task in ['abc391_d','abc338_b','abc357_b']:
              html=pathlib.Path(f'pages/{task}.html').read_text(encoding='utf-8',errors='replace')
              soup=BeautifulSoup(html,'html.parser')
              container=soup.select_one('span.lang-en')
              if container is None:
                  raise SystemExit(f'English statement missing: {task}')
              # Remove any links/navigation/scripts; keep only visible task statement text.
              for tag in container.select('script,style'):
                  tag.decompose()
              text='\n'.join(line.strip() for line in container.get_text('\n').splitlines() if line.strip())
              out.append({'task_id':task,'statement_text':text})
          print('===R8H_PUBLIC_STATEMENTS_BEGIN===')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          print('===R8H_PUBLIC_STATEMENTS_END===')
          PY
