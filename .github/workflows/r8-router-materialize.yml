name: R8-D LLMRouterBench Simple Query Router Challengers

on:
  push:
    branches:
      - 'research/decision-closure-ebd-v0.3'
    paths:
      - '.github/workflows/r8-router-materialize.yml'

permissions:
  contents: read

jobs:
  simple-query-routers:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Frozen protocol
        run: |
          echo 'EVIDENCE_CLASS=EXPLORATORY_OFFLINE_HELDOUT'
          echo 'SPLIT=SHA256_QUERY_70_30_IDENTICAL_TO_R8C'
          echo 'ARMS=BEST_SINGLE,DATASET_ROUTER,TFIDF_5NN,TFIDF_LINEAR,INSTANCE_ORACLE'
          echo 'NO_MODEL_API=1'
          echo 'NO_SECRETS=1'
      - name: Download verify extract
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 420 \
            --output bench-release.tar.gz \
            'https://huggingface.co/datasets/NPULH/LLMRouterBench/resolve/main/bench-release.tar.gz?download=true'
          echo 'b79f8cde1a6f029c2efa663a3a3b6f7748defb22341fe59f328cebef6648c8f1  bench-release.tar.gz' | sha256sum -c -
          mkdir extracted
          tar -xzf bench-release.tar.gz -C extracted
      - name: Install frozen dependency
        run: |
          python3 -m pip install --disable-pip-version-check --quiet 'scikit-learn==1.7.1'
          python3 -c "import sklearn; assert sklearn.__version__ == '1.7.1'; print(sklearn.__version__)"
      - name: Run R8-D
        run: python3 research/benchmark_rail_r8/r8d_simple_query_router_probe.py
