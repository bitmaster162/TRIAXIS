name: R9-C Weak Qwen Minimal Verifier Correction

on:
  push:
    branches:
      - 'research/decision-closure-ebd-v0.3'
    paths:
      - '.github/workflows/r9c-weak-qwen-verifier-correction.yml'

permissions:
  contents: read

jobs:
  r9c:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Verify frozen R9-C preregistration
        shell: bash
        run: |
          set -euo pipefail
          echo '219197b74e2e404ee49cb2758ed68077f9843f19cd62951e024e62b6540ce0c6  research/capability_upgrader_r9/R9C_PREREG.json' | sha256sum -c -
          python - <<'PY'
          import json
          p=json.load(open('research/capability_upgrader_r9/R9C_PREREG.json'))
          assert p['status']=='PREREGISTERED_BEFORE_R9C_MODEL_INFERENCE'
          assert p['sample_freeze']['task_order']==['abc361_f','abc325_e','abc376_e','abc389_d','abc354_b','abc400_b']
          print('R9C_PREREG=PASS')
          print('TASKS='+','.join(p['sample_freeze']['task_order']))
          PY

      - name: Install statement gate dependencies
        run: python -m pip install --disable-pip-version-check --quiet beautifulsoup4

      - name: Verify pinned benchmark split and run verifier contract gate
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/EverMind-AI/EvoAgentBench.git /tmp/EvoAgentBench
          git -C /tmp/EvoAgentBench checkout --quiet 948a17288782d5120778da16b4cf1cad9305d8b4
          test "$(git -C /tmp/EvoAgentBench rev-parse HEAD)" = '948a17288782d5120778da16b4cf1cad9305d8b4'
          test "$(git -C /tmp/EvoAgentBench hash-object benchmark/data/splits/code_implementation.json)" = '590137fc1e1f82034f7a3f5e7a448c055dc8c766'
          python - <<'PY'
          import hashlib,json,re,urllib.request
          from pathlib import Path
          from bs4 import BeautifulSoup
          prereg=json.load(open('research/capability_upgrader_r9/R9C_PREREG.json'))
          tasks=prereg['sample_freeze']['task_order']
          split=json.load(open('/tmp/EvoAgentBench/benchmark/data/splits/code_implementation.json'))
          assert all(q in split['test'] for q in tasks)
          assert not (set(tasks) & set(prereg['sample_freeze']['excluded_task_ids']))
          numeric=[x.lower() for x in prereg['verifier_contract_gate']['numeric_tolerance_markers'] if x.isascii()]
          nonunique=[x.lower() for x in prereg['verifier_contract_gate']['non_unique_markers'] if x.isascii()]
          nonunique += ['output any','print any','any answer','any arrangement','any sequence','any permutation','any such']
          wanted=('Problem Statement','Constraints','Input','Output')
          def sha(s): return hashlib.sha256(s.encode()).hexdigest()
          def fetch(url):
              req=urllib.request.Request(url,headers={'User-Agent':'TRIAXIS-R9C/1.0'})
              with urllib.request.urlopen(req,timeout=30) as r: return r.read().decode('utf-8')
          def statement(q):
              contest=q.split('_')[0]
              url=f'https://atcoder.jp/contests/{contest}/tasks/{q}?lang=en'
              html=fetch(url); soup=BeautifulSoup(html,'html.parser')
              eng=soup.select_one('#task-statement .lang-en') or soup.select_one('span.lang-en')
              if eng is None: raise RuntimeError('ENGLISH_STATEMENT_NOT_FOUND:'+q)
              pieces=[]; sections={}
              for h in eng.find_all('h3'):
                  title=h.get_text(' ',strip=True)
                  if title not in wanted: continue
                  body=[]
                  for sib in h.next_siblings:
                      if getattr(sib,'name',None)=='h3': break
                      t=sib.get_text('\n',strip=True) if hasattr(sib,'get_text') else str(sib).strip()
                      if t: body.append(t)
                  sections[title]='\n'.join(body).strip()
                  pieces.append('### '+title+'\n'+sections[title])
              text='\n\n'.join(pieces).strip()
              if any(x not in sections for x in wanted): raise RuntimeError('STATEMENT_SECTION_MISSING:'+q)
              return url,html,text,sections
          gate=[]; store={}
          for q in tasks:
              url,html,text,sections=statement(q)
              out=sections['Output'].lower()
              reasons=[]
              if any(m in out for m in numeric): reasons.append('NUMERIC_TOLERANCE')
              if any(m in out for m in nonunique): reasons.append('NON_UNIQUE_OR_PROPERTY_OUTPUT')
              decision='QUARANTINE' if reasons else 'NO_MISMATCH_DETECTED'
              gate.append({'task_id':q,'decision':decision,'reasons':reasons,'statement_sha256':sha(text),'output_sha256':sha(sections['Output']),'url':url})
              store[q]={'text':text,'statement_sha256':sha(text),'url':url}
              print('CONTRACT_GATE',q,decision,','.join(reasons) if reasons else 'EXACT_PATH_ELIGIBLE',sha(text))
          admitted=[r['task_id'] for r in gate if r['decision']=='NO_MISMATCH_DETECTED']
          if not admitted: raise RuntimeError('NO_ADMITTED_TASKS')
          Path('r9c_contract_gate.json').write_text(json.dumps({'schema':'triaxis.r9c.contract_gate/v1','gate_source':'R8-L_FROZEN_RULE','tasks':gate,'admitted':admitted,'quarantined':[r['task_id'] for r in gate if r['decision']=='QUARANTINE']},indent=2,sort_keys=True)+'\n')
          Path('r9c_statements.json').write_text(json.dumps(store,indent=2,sort_keys=True)+'\n')
          print('ADMITTED='+','.join(admitted))
          PY

      - name: Upload contract gate receipt before inference
        uses: actions/upload-artifact@v4
        with:
          name: r9c-contract-gate
          path: r9c_contract_gate.json
          if-no-files-found: error
          retention-days: 30

      - name: Verify exact source revision and build pinned llama.cpp
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 'https://huggingface.co/ggml-org/Qwen3.5-0.8B-GGUF/resolve/main/.src_sha?download=true' -o /tmp/src_sha
          grep -Fq '2fc06364715b967f1860aea9cf38778875588b17' /tmp/src_sha
          git clone --quiet https://github.com/ggml-org/llama.cpp.git /tmp/llama.cpp
          git -C /tmp/llama.cpp checkout --quiet bdffafa5df64e10cb6eef2f3bba4b4afc5f1c149
          cmake -S /tmp/llama.cpp -B /tmp/llama.cpp/build -DGGML_NATIVE=OFF -DGGML_OPENMP=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/llama.cpp/build -j2 --target llama-server
          python -m pip install --disable-pip-version-check --quiet 'datasets==2.21.0' 'huggingface-hub==0.33.4' 'numpy==2.2.6' 'pandas==2.2.3' 'tqdm==4.67.1'
          echo SOURCE_REVISION_MATCH=PASS

      - name: Start exact-source BF16 server
        shell: bash
        run: |
          set -euo pipefail
          /tmp/llama.cpp/build/bin/llama-server -hf ggml-org/Qwen3.5-0.8B-GGUF:BF16 --host 127.0.0.1 --port 8080 -c 8192 -np 1 -t 4 --no-webui > /tmp/llama.log 2>&1 &
          echo $! > /tmp/llama.pid
          for i in $(seq 1 150); do
            if curl -fsS http://127.0.0.1:8080/health >/tmp/health.json 2>/dev/null; then cat /tmp/health.json; exit 0; fi
            sleep 2
          done
          tail -n 120 /tmp/llama.log
          exit 1

      - name: Generate W0 direct outputs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,re,time,urllib.request
          from pathlib import Path
          prereg=json.load(open('research/capability_upgrader_r9/R9C_PREREG.json'))
          gate=json.load(open('r9c_contract_gate.json')); statements=json.load(open('r9c_statements.json'))
          prefix=prereg['arms']['W0_DIRECT']['prompt_prefix']
          def sha(s): return hashlib.sha256(s.encode()).hexdigest()
          def extract(raw):
              text=raw.strip(); m=re.search(r'```(?:python3?|py)?\s*\n(.*?)```',text,re.I|re.S); code=(m.group(1) if m else text).strip(); lines=code.splitlines()
              if lines and lines[0].strip().lower() in ('python','python3'): code='\n'.join(lines[1:]).strip()
              return code
          records=[]
          for q in gate['admitted']:
              prompt=prefix+'\n\n'+statements[q]['text']
              payload={'messages':[{'role':'user','content':prompt}],'temperature':0,'max_tokens':768,'chat_template_kwargs':{'enable_thinking':False}}
              req=urllib.request.Request('http://127.0.0.1:8080/v1/chat/completions',data=json.dumps(payload).encode(),headers={'Content-Type':'application/json'})
              t=time.time()
              with urllib.request.urlopen(req,timeout=180) as r: data=json.load(r)
              raw=data['choices'][0]['message']['content']; code=extract(raw); elapsed=time.time()-t; usage=data.get('usage',{})
              rec={'task_id':q,'arm':'W0_DIRECT','statement_sha256':statements[q]['statement_sha256'],'prompt_sha256':sha(prompt),'raw_output':raw,'extracted_code':code,'raw_output_sha256':sha(raw),'code_sha256':sha(code),'generation_seconds':elapsed,'completion_tokens':usage.get('completion_tokens')}
              records.append(rec); print('W0_GEN',q,'SEC=%.3f'%elapsed,'TOKENS='+str(rec['completion_tokens']),'CODE_SHA='+rec['code_sha256'])
          out={'schema':'triaxis.r9c.w0_raw_outputs/v1','prereg_sha256':'219197b74e2e404ee49cb2758ed68077f9843f19cd62951e024e62b6540ce0c6','source_model':'Qwen/Qwen3.5-0.8B','source_revision':'2fc06364715b967f1860aea9cf38778875588b17','backend_epoch':'R9C_LLAMA_CPP_BF16','llama_cpp':'bdffafa5df64e10cb6eef2f3bba4b4afc5f1c149','decode':{'temperature':0,'max_tokens':768,'enable_thinking':False},'admitted_tasks':gate['admitted'],'records':records}
          Path('r9c_w0_outputs.json').write_text(json.dumps(out,ensure_ascii=False,indent=2,sort_keys=True)+'\n')
          print('R9C_W0_OUTPUT_SHA256='+hashlib.sha256(Path('r9c_w0_outputs.json').read_bytes()).hexdigest())
          PY

      - name: Freeze W0 outputs before hidden scoring
        uses: actions/upload-artifact@v4
        with:
          name: r9c-w0-raw-outputs
          path: r9c_w0_outputs.json
          if-no-files-found: error
          retention-days: 30

      - name: Prepare pinned native verifier
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/LiveCodeBench/LiveCodeBench.git LiveCodeBench
          git -C LiveCodeBench checkout --quiet 28fef95ea8c9f7a547c8329f2cd3d32b92c1fa24
          curl -L --fail --retry 3 --retry-delay 2 'https://huggingface.co/datasets/livecodebench/code_generation_lite/resolve/503416f80ac447d31f252d8434023786ce45dd0c/test6.jsonl?download=true' -o /tmp/test6.jsonl
          test "$(stat -c %s /tmp/test6.jsonl)" = '134303240'
          echo 'bb4c364f71921c4495a6ad15abe1a927350b720009f4933e2e71f8af0f6fd1f5  /tmp/test6.jsonl' | sha256sum -c -

      - name: Native hidden score W0 and emit sanitized failure queue
        env:
          LCB_REPO: ./LiveCodeBench
          LCB_COMMIT: 28fef95ea8c9f7a547c8329f2cd3d32b92c1fa24
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,pathlib,sys
          gate=json.load(open('r9c_contract_gate.json')); tasks=gate['admitted']; data=json.load(open('r9c_w0_outputs.json')); codes={r['task_id']:r['extracted_code'] for r in data['records']}
          rows={}
          with open('/tmp/test6.jsonl',encoding='utf-8') as f:
              for line in f:
                  if not any(q in line for q in tasks): continue
                  row=json.loads(line); q=str(row.get('question_id'))
                  if q in tasks: rows[q]=row
          if set(rows)!=set(tasks): raise RuntimeError('TASK_ROWS_NOT_FOUND:'+repr(sorted(set(tasks)-set(rows))))
          sys.path.insert(0,str(pathlib.Path(os.environ['LCB_REPO']).resolve()))
          from lcb_runner.benchmarks.code_generation import CodeGenerationProblem
          from lcb_runner.evaluation.compute_code_generation_metrics import check_correctness
          def flat(v):
              o=[]
              def w(x):
                  if isinstance(x,(list,tuple)):
                      for z in x:w(z)
                  else:o.append(x)
              w(v); return o
          def cls(v):
              if v and all(x is True or x==1 for x in v): return 'PASS'
              if any(x==-3 for x in v): return 'TLE'
              if any(x==-4 for x in v): return 'RE'
              if any(x==-2 for x in v): return 'WA'
              if any(x==-1 for x in v): return 'CE_OR_TIMEOUT'
              return 'FAIL'
          res=[]; queue=[]
          for q in tasks:
              p=CodeGenerationProblem(**rows[q]); sample=p.get_evaluation_sample(); rl,meta=check_correctness(sample,codes[q],timeout=6,debug=False); v=flat(rl); total=len(v); passed=sum(1 for x in v if x is True or x==1); verdict=cls(v); reward=1.0 if total and passed==total else 0.0
              rec={'task_id':q,'reward':reward,'passed':passed,'total':total,'verdict':verdict}; res.append(rec)
              if reward==0.0: queue.append({'task_id':q,'verdict':verdict})
              print('W0_SCORE',q,verdict,str(passed)+'/'+str(total))
          out={'schema':'triaxis.r9c.w0_native_result/v1','livecodebench_commit':os.environ['LCB_COMMIT'],'test6_sha256':'bb4c364f71921c4495a6ad15abe1a927350b720009f4933e2e71f8af0f6fd1f5','results':res,'eligible_corrections':queue,'hidden_test_content_disclosed':False}
          pathlib.Path('r9c_w0_native_result.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          pathlib.Path('r9c_failure_queue.json').write_text(json.dumps({'schema':'triaxis.r9c.sanitized_failure_queue/v1','failures':queue,'allowed_fields':['task_id','verdict'],'hidden_test_content_disclosed':False},indent=2,sort_keys=True)+'\n')
          PY

      - name: Upload sanitized W0 score before correction
        uses: actions/upload-artifact@v4
        with:
          name: r9c-w0-native-result
          path: |
            r9c_w0_native_result.json
            r9c_failure_queue.json
          if-no-files-found: error
          retention-days: 30

      - name: Generate at most one minimal verifier-conditioned correction
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,re,time,urllib.request
          from pathlib import Path
          prereg=json.load(open('research/capability_upgrader_r9/R9C_PREREG.json')); statements=json.load(open('r9c_statements.json')); w0=json.load(open('r9c_w0_outputs.json')); fq=json.load(open('r9c_failure_queue.json'))
          prior={r['task_id']:r for r in w0['records']}; template=prereg['arms']['V1_MINIMAL_VERIFIER_CORRECTION']['prompt_template']
          def sha(s): return hashlib.sha256(s.encode()).hexdigest()
          def extract(raw):
              text=raw.strip(); m=re.search(r'```(?:python3?|py)?\s*\n(.*?)```',text,re.I|re.S); code=(m.group(1) if m else text).strip(); lines=code.splitlines()
              if lines and lines[0].strip().lower() in ('python','python3'): code='\n'.join(lines[1:]).strip()
              return code
          records=[]
          for item in fq['failures']:
              q=item['task_id']; verdict=item['verdict']
              feedback=template.replace('<VERDICT>',verdict)
              prompt=feedback+'\n\nORIGINAL PROBLEM:\n'+statements[q]['text']+'\n\nPREVIOUS SUBMISSION:\n'+prior[q]['extracted_code']
              payload={'messages':[{'role':'user','content':prompt}],'temperature':0,'max_tokens':768,'chat_template_kwargs':{'enable_thinking':False}}
              req=urllib.request.Request('http://127.0.0.1:8080/v1/chat/completions',data=json.dumps(payload).encode(),headers={'Content-Type':'application/json'})
              t=time.time()
              with urllib.request.urlopen(req,timeout=180) as r: data=json.load(r)
              raw=data['choices'][0]['message']['content']; code=extract(raw); elapsed=time.time()-t; usage=data.get('usage',{})
              rec={'task_id':q,'arm':'V1_MINIMAL_VERIFIER_CORRECTION','verifier_feedback':verdict,'prompt_sha256':sha(prompt),'previous_code_sha256':prior[q]['code_sha256'],'raw_output':raw,'extracted_code':code,'raw_output_sha256':sha(raw),'code_sha256':sha(code),'generation_seconds':elapsed,'completion_tokens':usage.get('completion_tokens')}
              records.append(rec); print('V1_GEN',q,verdict,'SEC=%.3f'%elapsed,'TOKENS='+str(rec['completion_tokens']),'CODE_SHA='+rec['code_sha256'])
          out={'schema':'triaxis.r9c.v1_raw_outputs/v1','feedback_fields':['sanitized_verdict_class'],'max_corrections':1,'hidden_test_content_disclosed':False,'records':records}
          Path('r9c_v1_outputs.json').write_text(json.dumps(out,ensure_ascii=False,indent=2,sort_keys=True)+'\n')
          print('R9C_V1_OUTPUT_SHA256='+hashlib.sha256(Path('r9c_v1_outputs.json').read_bytes()).hexdigest())
          PY

      - name: Freeze V1 outputs before fresh re-verification
        uses: actions/upload-artifact@v4
        with:
          name: r9c-v1-raw-outputs
          path: r9c_v1_outputs.json
          if-no-files-found: error
          retention-days: 30

      - name: Fresh native reverify and paired adjudication
        env:
          LCB_REPO: ./LiveCodeBench
          LCB_COMMIT: 28fef95ea8c9f7a547c8329f2cd3d32b92c1fa24
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,pathlib,sys
          gate=json.load(open('r9c_contract_gate.json')); tasks=gate['admitted']; w0r=json.load(open('r9c_w0_native_result.json')); v1=json.load(open('r9c_v1_outputs.json')); w0o=json.load(open('r9c_w0_outputs.json'))
          w0={r['task_id']:r for r in w0r['results']}; v1codes={r['task_id']:r['extracted_code'] for r in v1['records']}
          rows={}
          with open('/tmp/test6.jsonl',encoding='utf-8') as f:
              for line in f:
                  if not any(q in line for q in tasks): continue
                  row=json.loads(line); q=str(row.get('question_id'))
                  if q in tasks: rows[q]=row
          sys.path.insert(0,str(pathlib.Path(os.environ['LCB_REPO']).resolve()))
          from lcb_runner.benchmarks.code_generation import CodeGenerationProblem
          from lcb_runner.evaluation.compute_code_generation_metrics import check_correctness
          def flat(v):
              o=[]
              def w(x):
                  if isinstance(x,(list,tuple)):
                      for z in x:w(z)
                  else:o.append(x)
              w(v); return o
          def cls(v):
              if v and all(x is True or x==1 for x in v): return 'PASS'
              if any(x==-3 for x in v): return 'TLE'
              if any(x==-4 for x in v): return 'RE'
              if any(x==-2 for x in v): return 'WA'
              if any(x==-1 for x in v): return 'CE_OR_TIMEOUT'
              return 'FAIL'
          v1res=[]
          for q,code in v1codes.items():
              p=CodeGenerationProblem(**rows[q]); sample=p.get_evaluation_sample(); rl,meta=check_correctness(sample,code,timeout=6,debug=False); vals=flat(rl); total=len(vals); passed=sum(1 for x in vals if x is True or x==1); verdict=cls(vals); reward=1.0 if total and passed==total else 0.0
              v1res.append({'task_id':q,'reward':reward,'passed':passed,'total':total,'verdict':verdict}); print('V1_SCORE',q,verdict,str(passed)+'/'+str(total))
          v1map={r['task_id']:r for r in v1res}
          paired=[]; rescues=0; unchanged_failures=0; selective_harms=0
          for q in tasks:
              a=w0[q]
              if a['reward']==1.0:
                  paired.append({'task_id':q,'w0':'PASS','v1_policy':'NOT_INVOKED_W0_PASS','final':'PASS','transition':'UNCHANGED_PASS'})
              else:
                  b=v1map[q]
                  if b['reward']==1.0: rescues+=1; tr='RESCUE'
                  else: unchanged_failures+=1; tr='UNCHANGED_FAILURE'
                  paired.append({'task_id':q,'w0':a['verdict'],'v1_policy':b['verdict'],'final':'PASS' if b['reward']==1.0 else b['verdict'],'transition':tr})
          w0_tokens=sum((r.get('completion_tokens') or 0) for r in w0o['records']); w0_sec=sum(float(r.get('generation_seconds') or 0) for r in w0o['records'])
          v1_tokens=sum((r.get('completion_tokens') or 0) for r in v1['records']); v1_sec=sum(float(r.get('generation_seconds') or 0) for r in v1['records'])
          quarantined=gate['quarantined']; valid=len(tasks); w0_pass=sum(1 for r in w0.values() if r['reward']==1.0); final_pass=w0_pass+rescues
          candidate_positive=(rescues>=1 and selective_harms==0)
          out={'schema':'triaxis.r9c.final_result/v1','source_model':'Qwen/Qwen3.5-0.8B','source_revision':'2fc06364715b967f1860aea9cf38778875588b17','livecodebench_commit':os.environ['LCB_COMMIT'],'test6_sha256':'bb4c364f71921c4495a6ad15abe1a927350b720009f4933e2e71f8af0f6fd1f5','sample_total':valid+len(quarantined),'valid_denominator':valid,'quarantined':quarantined,'w0_pass':w0_pass,'final_policy_pass':final_pass,'rescues':rescues,'unchanged_failures':unchanged_failures,'selective_policy_harms':selective_harms,'harm_opportunities_on_w0_pass':0,'harm_note':'V1 is not invoked on W0 passes by preregistered selective policy; harm on passes is structurally prevented, not empirically estimated.','paired':paired,'cost':{'w0_completion_tokens':w0_tokens,'additional_v1_completion_tokens':v1_tokens,'w0_generation_seconds':w0_sec,'additional_v1_generation_seconds':v1_sec},'candidate_positive_smoke':candidate_positive,'promotion':'DENY_FROM_SMOKE_ALONE; fresh confirmatory replication required if candidate-positive','hidden_test_content_disclosed':False,'ebrc_cognitive_lift_credit':0}
          pathlib.Path('r9c_final_result.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print('===R9C_FINAL_RESULT_BEGIN==='); print(json.dumps(out,indent=2,sort_keys=True)); print('===R9C_FINAL_RESULT_END===')
          PY

      - name: Upload final R9-C result
        uses: actions/upload-artifact@v4
        with:
          name: r9c-final-result
          path: r9c_final_result.json
          if-no-files-found: error
          retention-days: 30

      - name: Runtime tail
        if: always()
        run: tail -n 80 /tmp/llama.log || true
