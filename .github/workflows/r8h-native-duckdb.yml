name: R8-H Native Code Smoke DuckDB Shard Local

on:
  push:
    branches:
      - 'research/decision-closure-ebd-v0.3'
    paths:
      - '.github/workflows/r8h-native-duckdb.yml'

permissions:
  contents: read

jobs:
  verify-b0:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Freeze
        run: |
          echo 'B0=b975656f11d89e86ef3fbfa30f139310ca6c980e'
          echo 'LCB=28fef95ea8c9f7a547c8329f2cd3d32b92c1fa24'
          echo 'HF_PARQUET_SNAPSHOT=d44be6b144381afa49392b1f0eb424a64a4d8a10'
          echo 'RELEASE=release_v6'
          echo 'EXPECTED_RELEASE_ROWS=1055'
          echo 'TASKS=abc391_d,abc338_b,abc357_b'
          echo 'DATA_ACCESS=PINNED_PARQUET_DUCKDB_SHARD_LOCAL_HTTP_RANGE'
          echo 'INSTRUMENT_REPAIR=LOCATE_BY_QUESTION_ID_COLUMN_THEN_MATERIALIZE_MATCHED_SHARDS_ONLY'
          echo 'NO_MODEL_API=1'
          echo 'NO_SECRETS=1'

      - name: Prepare
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet \
            'duckdb==1.3.2' 'datasets==2.21.0' 'huggingface-hub==0.33.4' \
            'numpy==2.2.6' 'pandas==2.2.3' 'tqdm==4.67.1'
          git clone --quiet https://github.com/LiveCodeBench/LiveCodeBench.git LiveCodeBench
          git -C LiveCodeBench checkout --quiet 28fef95ea8c9f7a547c8329f2cd3d32b92c1fa24
          test "$(git -C LiveCodeBench rev-parse HEAD)" = '28fef95ea8c9f7a547c8329f2cd3d32b92c1fa24'

      - name: Verify frozen B0
        env:
          LCB_REPO: ./LiveCodeBench
          LCB_COMMIT: 28fef95ea8c9f7a547c8329f2cd3d32b92c1fa24
        run: python research/benchmark_rail_r8/r8h_native_verify_b0_duckdb.py
