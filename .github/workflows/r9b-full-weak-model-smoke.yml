name: R9-B Full Qwen3.5 Weak Model Donor Smoke

on:
  push:
    branches:
      - 'research/decision-closure-ebd-v0.3'
    paths:
      - '.github/workflows/r9b-full-weak-model-smoke.yml'

permissions:
  contents: read

jobs:
  r9b:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Freeze R9 contract and backend epoch
        run: |
          echo 'R9_PREREG_SHA256=678741da709023ff69307467566b835abc2b47fed04de9874c1f79a4293919b9'
          echo 'SOURCE_MODEL=Qwen/Qwen3.5-0.8B'
          echo 'SOURCE_REVISION=2fc06364715b967f1860aea9cf38778875588b17'
          echo 'GGUF_REPO=ggml-org/Qwen3.5-0.8B-GGUF'
          echo 'GGUF_VARIANT=BF16'
          echo 'LLAMA_CPP=bdffafa5df64e10cb6eef2f3bba4b4afc5f1c149'
          echo 'EVOAGENTBENCH=948a17288782d5120778da16b4cf1cad9305d8b4'
          echo 'LCB=28fef95ea8c9f7a547c8329f2cd3d32b92c1fa24'
          echo 'TEST6_COMMIT=503416f80ac447d31f252d8434023786ce45dd0c'
          echo 'TEST6_SHA256=bb4c364f71921c4495a6ad15abe1a927350b720009f4933e2e71f8af0f6fd1f5'
          echo 'TASKS=abc394_a,abc395_c,abc394_g'
          echo 'ARMS=W0_DIRECT,W1_GENERIC_CONTROL,W2_TARGETED_CODE_SKILL'
          echo 'DECODE=GREEDY_MAX_NEW_TOKENS_768_THINKING_OFF'
          echo 'BACKEND_EPOCH=R9B_LLAMA_CPP_BF16'
          echo 'NO_SECRETS=1'
          echo 'NO_PAID_MODEL_API=1'

      - name: Verify exact source revision
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 'https://huggingface.co/ggml-org/Qwen3.5-0.8B-GGUF/resolve/main/.src_sha?download=true' -o /tmp/src_sha
          grep -Fq '2fc06364715b967f1860aea9cf38778875588b17' /tmp/src_sha
          echo SOURCE_REVISION_MATCH=PASS

      - name: Build pinned llama.cpp and install verifier deps
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/ggml-org/llama.cpp.git /tmp/llama.cpp
          git -C /tmp/llama.cpp checkout --quiet bdffafa5df64e10cb6eef2f3bba4b4afc5f1c149
          cmake -S /tmp/llama.cpp -B /tmp/llama.cpp/build -DGGML_NATIVE=OFF -DGGML_OPENMP=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/llama.cpp/build -j2 --target llama-server
          python -m pip install --disable-pip-version-check --quiet beautifulsoup4 'datasets==2.21.0' 'huggingface-hub==0.33.4' 'numpy==2.2.6' 'pandas==2.2.3' 'tqdm==4.67.1'

      - name: Start exact-source BF16 server
        shell: bash
        run: |
          set -euo pipefail
          /tmp/llama.cpp/build/bin/llama-server -hf ggml-org/Qwen3.5-0.8B-GGUF:BF16 --host 127.0.0.1 --port 8080 -c 8192 -np 1 -t 4 --no-webui > /tmp/llama.log 2>&1 &
          echo $! > /tmp/llama.pid
          for i in $(seq 1 150); do
            if curl -fsS http://127.0.0.1:8080/health >/tmp/health.json 2>/dev/null; then cat /tmp/health.json; exit 0; fi
            sleep 2
          done
          tail -n 120 /tmp/llama.log
          exit 1

      - name: Generate frozen matched outputs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,re,time,urllib.request
          from pathlib import Path
          from bs4 import BeautifulSoup
          TASKS={
            'abc394_a':'https://atcoder.jp/contests/abc394/tasks/abc394_a?lang=en',
            'abc395_c':'https://atcoder.jp/contests/abc395/tasks/abc395_c?lang=en',
            'abc394_g':'https://atcoder.jp/contests/abc394/tasks/abc394_g?lang=en',
          }
          ARMS={
            'W0_DIRECT':'Solve the programming problem below. Return only valid Python 3 source code. No Markdown fences, explanation, or prose.',
            'W1_GENERIC_CONTROL':'Solve the programming problem below. Before answering, internally restate the objective, identify assumptions, consider an alternative, check consistency, and verify instruction compliance. Do not reveal this analysis. Return only valid Python 3 source code.',
            'W2_TARGETED_CODE_SKILL':'Solve the programming problem below. Before answering, internally classify the exact input/output contract, derive an invariant and algorithm that fit the constraints, verify time and memory complexity, test samples and boundary cases, and check indexing/numeric pitfalls. Do not reveal this analysis. Return only valid Python 3 source code.',
          }
          WANTED=('Problem Statement','Constraints','Input','Output')
          def sha(s): return hashlib.sha256(s.encode()).hexdigest()
          def get(url):
            req=urllib.request.Request(url,headers={'User-Agent':'TRIAXIS-R9B/1.0'})
            with urllib.request.urlopen(req,timeout=30) as r: return r.read().decode('utf-8')
          def statement(url):
            html=get(url); soup=BeautifulSoup(html,'html.parser'); eng=soup.select_one('#task-statement .lang-en') or soup.select_one('span.lang-en')
            if eng is None: raise RuntimeError('ENGLISH_STATEMENT_NOT_FOUND')
            pieces=[]
            for h in eng.find_all('h3'):
              title=h.get_text(' ',strip=True)
              if title not in WANTED: continue
              body=[]
              for sib in h.next_siblings:
                if getattr(sib,'name',None)=='h3': break
                t=sib.get_text('\n',strip=True) if hasattr(sib,'get_text') else str(sib).strip()
                if t: body.append(t)
              pieces.append('### '+title+'\n'+'\n'.join(body))
            text='\n\n'.join(pieces).strip()
            if any('### '+x not in text for x in WANTED): raise RuntimeError('STATEMENT_SECTION_MISSING')
            return text,sha(html),sha(text)
          def extract(raw):
            text=raw.strip(); m=re.search(r'```(?:python3?|py)?\s*\n(.*?)```',text,re.I|re.S); code=(m.group(1) if m else text).strip(); lines=code.splitlines()
            if lines and lines[0].strip().lower() in ('python','python3'): code='\n'.join(lines[1:]).strip()
            return code
          statements={}
          for q,u in TASKS.items():
            s,hh,hs=statement(u); statements[q]={'text':s,'html_sha256':hh,'statement_sha256':hs,'url':u}; print('STATEMENT_RECEIPT',q,hs)
          records=[]
          for q in ('abc394_a','abc395_c','abc394_g'):
            for arm in ('W0_DIRECT','W1_GENERIC_CONTROL','W2_TARGETED_CODE_SKILL'):
              prompt=ARMS[arm]+'\n\n'+statements[q]['text']
              payload={'messages':[{'role':'user','content':prompt}],'temperature':0,'max_tokens':768,'chat_template_kwargs':{'enable_thinking':False}}
              req=urllib.request.Request('http://127.0.0.1:8080/v1/chat/completions',data=json.dumps(payload).encode(),headers={'Content-Type':'application/json'})
              t=time.time()
              with urllib.request.urlopen(req,timeout=180) as r: data=json.load(r)
              raw=data['choices'][0]['message']['content']; code=extract(raw); elapsed=time.time()-t
              usage=data.get('usage',{})
              rec={'task_id':q,'arm':arm,'statement_sha256':statements[q]['statement_sha256'],'prompt_sha256':sha(prompt),'raw_output':raw,'extracted_code':code,'raw_output_sha256':sha(raw),'code_sha256':sha(code),'generation_seconds':elapsed,'completion_tokens':usage.get('completion_tokens')}
              records.append(rec); print('GEN',q,arm,'SEC=%.3f'%elapsed,'TOKENS='+str(rec['completion_tokens']),'CODE_SHA='+rec['code_sha256'])
          out={'schema':'triaxis.r9b.qwen_raw_outputs/v1','source_model':'Qwen/Qwen3.5-0.8B','source_revision':'2fc06364715b967f1860aea9cf38778875588b17','backend_epoch':'R9B_LLAMA_CPP_BF16','llama_cpp':'bdffafa5df64e10cb6eef2f3bba4b4afc5f1c149','decode':{'temperature':0,'max_tokens':768,'enable_thinking':False},'statements':{k:{kk:vv for kk,vv in v.items() if kk!='text'} for k,v in statements.items()},'arms':ARMS,'records':records}
          Path('r9b_outputs.json').write_text(json.dumps(out,ensure_ascii=False,indent=2,sort_keys=True)+'\n')
          print('R9B_OUTPUT_ARTIFACT_SHA256='+hashlib.sha256(Path('r9b_outputs.json').read_bytes()).hexdigest())
          PY

      - name: Upload raw outputs before hidden scoring
        uses: actions/upload-artifact@v4
        with:
          name: r9b-qwen-raw-outputs
          path: r9b_outputs.json
          if-no-files-found: error
          retention-days: 30

      - name: Prepare pinned native verifier
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/LiveCodeBench/LiveCodeBench.git LiveCodeBench
          git -C LiveCodeBench checkout --quiet 28fef95ea8c9f7a547c8329f2cd3d32b92c1fa24
          curl -L --fail --retry 3 --retry-delay 2 'https://huggingface.co/datasets/livecodebench/code_generation_lite/resolve/503416f80ac447d31f252d8434023786ce45dd0c/test6.jsonl?download=true' -o /tmp/test6.jsonl
          test "$(stat -c %s /tmp/test6.jsonl)" = '134303240'
          echo 'bb4c364f71921c4495a6ad15abe1a927350b720009f4933e2e71f8af0f6fd1f5  /tmp/test6.jsonl' | sha256sum -c -

      - name: Native hidden scoring
        env:
          LCB_REPO: ./LiveCodeBench
          LCB_COMMIT: 28fef95ea8c9f7a547c8329f2cd3d32b92c1fa24
        shell: bash
        run: |
          python - <<'PY'
          import json,os,pathlib,sys
          TASKS=('abc394_a','abc395_c','abc394_g'); ARMS=('W0_DIRECT','W1_GENERIC_CONTROL','W2_TARGETED_CODE_SKILL')
          data=json.load(open('r9b_outputs.json')); codes={(r['task_id'],r['arm']):r['extracted_code'] for r in data['records']}
          rows={}
          with open('/tmp/test6.jsonl',encoding='utf-8') as f:
            for line in f:
              if not any(q in line for q in TASKS): continue
              row=json.loads(line); q=str(row.get('question_id'))
              if q in TASKS: rows[q]=row
          if set(rows)!=set(TASKS): raise RuntimeError('TASK_ROWS_NOT_FOUND:'+repr(sorted(set(TASKS)-set(rows))))
          sys.path.insert(0,str(pathlib.Path(os.environ['LCB_REPO']).resolve()))
          from lcb_runner.benchmarks.code_generation import CodeGenerationProblem
          from lcb_runner.evaluation.compute_code_generation_metrics import check_correctness
          def flat(v):
            o=[]
            def w(x):
              if isinstance(x,(list,tuple)):
                for z in x:w(z)
              else:o.append(x)
            w(v); return o
          def cls(v):
            if v and all(x is True or x==1 for x in v): return 'PASS'
            if any(x==-3 for x in v): return 'TLE'
            if any(x==-4 for x in v): return 'RE'
            if any(x==-2 for x in v): return 'WA'
            if any(x==-1 for x in v): return 'CE_OR_TIMEOUT'
            return 'FAIL'
          res=[]
          for q in TASKS:
            for arm in ARMS:
              p=CodeGenerationProblem(**rows[q]); sample=p.get_evaluation_sample(); rl,meta=check_correctness(sample,codes[(q,arm)],timeout=6,debug=False); v=flat(rl); total=len(v); passed=sum(1 for x in v if x is True or x==1)
              res.append({'task_id':q,'arm':arm,'reward':1.0 if total and passed==total else 0.0,'passed':passed,'total':total,'error_class':cls(v)})
          sums={a:sum(int(r['reward']==1.0) for r in res if r['arm']==a) for a in ARMS}
          def rr(q,a): return next(r['reward'] for r in res if r['task_id']==q and r['arm']==a)
          rescues=sum(1 for q in TASKS if rr(q,'W1_GENERIC_CONTROL')==0 and rr(q,'W2_TARGETED_CODE_SKILL')==1)
          harms=sum(1 for q in TASKS if rr(q,'W1_GENERIC_CONTROL')==1 and rr(q,'W2_TARGETED_CODE_SKILL')==0)
          out={'schema':'triaxis.r9b.native_result/v1','source_model':'Qwen/Qwen3.5-0.8B','source_revision':'2fc06364715b967f1860aea9cf38778875588b17','backend_epoch':'R9B_LLAMA_CPP_BF16','prereg_sha256':'678741da709023ff69307467566b835abc2b47fed04de9874c1f79a4293919b9','livecodebench_commit':os.environ['LCB_COMMIT'],'test6_sha256':'bb4c364f71921c4495a6ad15abe1a927350b720009f4933e2e71f8af0f6fd1f5','results':res,'task_pass_counts':sums,'W2_vs_W1_rescues':rescues,'W2_vs_W1_harms':harms,'hidden_test_content_disclosed':False}
          print('===R9B_SANITIZED_NATIVE_RESULT_BEGIN==='); print(json.dumps(out,indent=2,sort_keys=True)); print('===R9B_SANITIZED_NATIVE_RESULT_END===')
          pathlib.Path('r9b_native_result.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          PY

      - name: Upload native result
        uses: actions/upload-artifact@v4
        with:
          name: r9b-native-result
          path: r9b_native_result.json
          if-no-files-found: error
          retention-days: 30

      - name: Runtime tail
        if: always()
        run: tail -n 80 /tmp/llama.log || true
