name: R9-C Verifier Recovery from Frozen W0

on:
  push:
    branches:
      - 'research/decision-closure-ebd-v0.3'
    paths:
      - '.github/workflows/r9c-verifier-recovery.yml'

permissions:
  contents: read
  actions: read

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Verify frozen R9-C prereg and amendment
        shell: bash
        run: |
          set -euo pipefail
          echo '219197b74e2e404ee49cb2758ed68077f9843f19cd62951e024e62b6540ce0c6  research/capability_upgrader_r9/R9C_PREREG.json' | sha256sum -c -
          echo 'bfb8b904d2b9782324bcd3590e482cdbf157632dfef3e8d79cba9a42ce96e0f3  research/capability_upgrader_r9/R9C_EXECUTION_AMENDMENT_R1_2026-08-14.json' | sha256sum -c -
          python - <<'PY'
          import json
          p=json.load(open('research/capability_upgrader_r9/R9C_PREREG.json'))
          a=json.load(open('research/capability_upgrader_r9/R9C_EXECUTION_AMENDMENT_R1_2026-08-14.json'))
          frozen=['abc361_f','abc325_e','abc376_e','abc389_d','abc354_b','abc400_b']
          assert p['status']=='PREREGISTERED_BEFORE_R9C_MODEL_INFERENCE'
          assert p['sample_freeze']['task_order']==frozen
          assert a['status']=='FROZEN_BEFORE_ANY_HIDDEN_VERDICT'
          assert a['frozen_w0']['task_order']==frozen
          assert a['recovery_invariants']['w0_regeneration'] is False
          assert a['source_binding']['hf_dataset_revision']=='503416f80ac447d31f252d8434023786ce45dd0c'
          assert a['source_binding']['hf_release_version']=='release_v6'
          print('R9C_RECOVERY_CONTRACT=PASS')
          PY

      - name: Download immutable frozen W0 artifact
        uses: actions/download-artifact@v4
        with:
          name: r9c-w0-raw-outputs
          path: frozen_w0
          github-token: ${{ github.token }}
          repository: bitmaster162/TRIAXIS
          run-id: 31736489210

      - name: Verify frozen W0 byte identity
        shell: bash
        run: |
          set -euo pipefail
          test -f frozen_w0/r9c_w0_outputs.json
          echo '41509199b23c44a995a8fc780b37c9132cb4ea589fad92f5ac5046ce4980ef3f  frozen_w0/r9c_w0_outputs.json' | sha256sum -c -
          python - <<'PY'
          import json
          d=json.load(open('frozen_w0/r9c_w0_outputs.json'))
          expected=[
            ('abc361_f',768,'7c72a2e4f24e473675e17f3c5bb0a446488ad80c67e3cfda140adb146ce7e2c5'),
            ('abc325_e',768,'06b2b8b0a2040e18f1d2a36bcff5e27ccf84b05aa954697e50e137ecba7a85b7'),
            ('abc376_e',768,'18e9d73b6033de696281e83ea0bfe6ab4bb4c54803ce6acd0e8851f94d1921c2'),
            ('abc389_d',768,'658b410a1db47315050726ac92fec6a861a2876994200456e573188dac9ad23e'),
            ('abc354_b',556,'2b97176a7551814e959bd4a7c541916be49e9d78d2c0a64b65fd097bff380797'),
            ('abc400_b',768,'0b97547127a72c3ebba3705f41230ca02c762d8bd9717f715c82498efb4edd31'),
          ]
          assert d['schema']=='triaxis.r9c.w0_raw_outputs/v1'
          assert d['source_model']=='Qwen/Qwen3.5-0.8B'
          assert d['source_revision']=='2fc06364715b967f1860aea9cf38778875588b17'
          assert d['admitted_tasks']==[x[0] for x in expected]
          got=[(r['task_id'],r['completion_tokens'],r['code_sha256']) for r in d['records']]
          assert got==expected
          print('FROZEN_W0_IDENTITY=PASS')
          PY

      - name: Install exact benchmark dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet \
            'datasets==2.21.0' \
            'huggingface-hub==0.33.4' \
            'numpy==2.2.6' \
            'pandas==2.2.3' \
            'tqdm==4.67.1' \
            'beautifulsoup4'
          git clone --quiet https://github.com/LiveCodeBench/LiveCodeBench.git LiveCodeBench
          git -C LiveCodeBench checkout --quiet 28fef95ea8c9f7a547c8329f2cd3d32b92c1fa24
          test "$(git -C LiveCodeBench rev-parse HEAD)" = '28fef95ea8c9f7a547c8329f2cd3d32b92c1fa24'

      - name: Load canonical pinned release_v6 and retain only frozen rows
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from datasets import load_dataset

          wanted=['abc361_f','abc325_e','abc376_e','abc389_d','abc354_b','abc400_b']
          ds=load_dataset(
              'livecodebench/code_generation_lite',
              split='test',
              version_tag='release_v6',
              revision='503416f80ac447d31f252d8434023786ce45dd0c',
              trust_remote_code=True,
              streaming=True,
          )
          rows={}
          seen=0
          for row in ds:
              seen += 1
              q=str(row.get('question_id'))
              if q in wanted:
                  if q in rows:
                      raise RuntimeError('DUPLICATE_TASK_ID:'+q)
                  rows[q]=dict(row)
                  print('PINNED_RELEASE_V6_ROW_FOUND',q)
                  if len(rows)==len(wanted):
                      break
          missing=sorted(set(wanted)-set(rows))
          if missing:
              raise RuntimeError('PINNED_RELEASE_V6_ROWS_MISSING:'+repr(missing))
          # Hidden test content remains runner-local. This file is never uploaded.
          Path('/tmp/r9c_release_v6_rows.json').write_text(
              json.dumps({q:rows[q] for q in wanted},ensure_ascii=False)
          )
          print('PINNED_RELEASE_V6_COVERAGE=6/6')
          print('ROWS_SCANNED='+str(seen))
          PY

      - name: Native hidden score frozen W0 and emit sanitized failure queue
        env:
          LCB_REPO: ./LiveCodeBench
          LCB_COMMIT: 28fef95ea8c9f7a547c8329f2cd3d32b92c1fa24
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,pathlib,sys
          tasks=['abc361_f','abc325_e','abc376_e','abc389_d','abc354_b','abc400_b']
          rows=json.load(open('/tmp/r9c_release_v6_rows.json'))
          data=json.load(open('frozen_w0/r9c_w0_outputs.json'))
          codes={r['task_id']:r['extracted_code'] for r in data['records']}
          sys.path.insert(0,str(pathlib.Path(os.environ['LCB_REPO']).resolve()))
          from lcb_runner.benchmarks.code_generation import CodeGenerationProblem
          from lcb_runner.evaluation.compute_code_generation_metrics import check_correctness

          def flat(v):
              out=[]
              def walk(x):
                  if isinstance(x,(list,tuple)):
                      for z in x: walk(z)
                  else: out.append(x)
              walk(v)
              return out

          def verdict(v):
              if v and all(x is True or x==1 for x in v): return 'PASS'
              if any(x==-3 for x in v): return 'TLE'
              if any(x==-4 for x in v): return 'RE'
              if any(x==-2 for x in v): return 'WA'
              if any(x==-1 for x in v): return 'CE_OR_TIMEOUT'
              return 'FAIL'

          results=[]
          queue=[]
          for q in tasks:
              problem=CodeGenerationProblem(**rows[q])
              sample=problem.get_evaluation_sample()
              rl,_meta=check_correctness(sample,codes[q],timeout=6,debug=False)
              vals=flat(rl)
              total=len(vals)
              passed=sum(1 for x in vals if x is True or x==1)
              v=verdict(vals)
              reward=1.0 if total and passed==total else 0.0
              results.append({'task_id':q,'reward':reward,'passed':passed,'total':total,'verdict':v})
              if reward==0.0:
                  queue.append({'task_id':q,'verdict':v})
              print('W0_SCORE',q,v,str(passed)+'/'+str(total))

          native={
            'schema':'triaxis.r9c.w0_native_result_recovery/v1',
            'source_run_id':31736489210,
            'frozen_w0_json_sha256':'41509199b23c44a995a8fc780b37c9132cb4ea589fad92f5ac5046ce4980ef3f',
            'evoagentbench_release_version':'release_v6',
            'hf_dataset_revision':'503416f80ac447d31f252d8434023786ce45dd0c',
            'livecodebench_commit':os.environ['LCB_COMMIT'],
            'results':results,
            'eligible_corrections':queue,
            'hidden_test_content_disclosed':False,
          }
          fq={
            'schema':'triaxis.r9c.sanitized_failure_queue_recovery/v1',
            'failures':queue,
            'allowed_fields':['task_id','verdict'],
            'hidden_test_content_disclosed':False,
          }
          pathlib.Path('r9c_w0_native_result.json').write_text(json.dumps(native,indent=2,sort_keys=True)+'\n')
          pathlib.Path('r9c_failure_queue.json').write_text(json.dumps(fq,indent=2,sort_keys=True)+'\n')
          PY

      - name: Freeze sanitized W0 score before correction
        uses: actions/upload-artifact@v4
        with:
          name: r9c-recovery-w0-native-result
          path: |
            r9c_w0_native_result.json
            r9c_failure_queue.json
          if-no-files-found: error
          retention-days: 30

      - name: Verify exact Qwen source and build pinned llama.cpp
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            'https://huggingface.co/ggml-org/Qwen3.5-0.8B-GGUF/resolve/main/.src_sha?download=true' \
            -o /tmp/src_sha
          grep -Fq '2fc06364715b967f1860aea9cf38778875588b17' /tmp/src_sha
          git clone --quiet https://github.com/ggml-org/llama.cpp.git /tmp/llama.cpp
          git -C /tmp/llama.cpp checkout --quiet bdffafa5df64e10cb6eef2f3bba4b4afc5f1c149
          cmake -S /tmp/llama.cpp -B /tmp/llama.cpp/build \
            -DGGML_NATIVE=OFF -DGGML_OPENMP=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/llama.cpp/build -j2 --target llama-server
          echo SOURCE_REVISION_MATCH=PASS

      - name: Start exact-source BF16 server
        shell: bash
        run: |
          set -euo pipefail
          /tmp/llama.cpp/build/bin/llama-server \
            -hf ggml-org/Qwen3.5-0.8B-GGUF:BF16 \
            --host 127.0.0.1 --port 8080 -c 8192 -np 1 -t 4 --no-webui \
            > /tmp/llama.log 2>&1 &
          echo $! > /tmp/llama.pid
          for i in $(seq 1 150); do
            if curl -fsS http://127.0.0.1:8080/health >/tmp/health.json 2>/dev/null; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 2
          done
          tail -n 120 /tmp/llama.log
          exit 1

      - name: Reconstruct exact original statements and verify W0 hashes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,urllib.request
          from pathlib import Path
          from bs4 import BeautifulSoup

          tasks=['abc361_f','abc325_e','abc376_e','abc389_d','abc354_b','abc400_b']
          w0=json.load(open('frozen_w0/r9c_w0_outputs.json'))
          expected={r['task_id']:r['statement_sha256'] for r in w0['records']}
          wanted=('Problem Statement','Constraints','Input','Output')

          def sha(s): return hashlib.sha256(s.encode()).hexdigest()
          def fetch(url):
              req=urllib.request.Request(url,headers={'User-Agent':'TRIAXIS-R9C-RECOVERY/1.0'})
              with urllib.request.urlopen(req,timeout=30) as r:
                  return r.read().decode('utf-8')
          def statement(q):
              contest=q.split('_')[0]
              url=f'https://atcoder.jp/contests/{contest}/tasks/{q}?lang=en'
              html=fetch(url)
              soup=BeautifulSoup(html,'html.parser')
              eng=soup.select_one('#task-statement .lang-en') or soup.select_one('span.lang-en')
              if eng is None:
                  raise RuntimeError('ENGLISH_STATEMENT_NOT_FOUND:'+q)
              pieces=[]
              found=set()
              for h in eng.find_all('h3'):
                  title=h.get_text(' ',strip=True)
                  if title not in wanted: continue
                  body=[]
                  for sib in h.next_siblings:
                      if getattr(sib,'name',None)=='h3': break
                      text=sib.get_text('\n',strip=True) if hasattr(sib,'get_text') else str(sib).strip()
                      if text: body.append(text)
                  pieces.append('### '+title+'\n'+'\n'.join(body))
                  found.add(title)
              if found != set(wanted):
                  raise RuntimeError('STATEMENT_SECTION_MISSING:'+q)
              return '\n\n'.join(pieces).strip()

          store={}
          for q in tasks:
              s=statement(q)
              actual=sha(s)
              if actual != expected[q]:
                  raise RuntimeError(f'STATEMENT_HASH_DRIFT:{q}:{actual}:{expected[q]}')
              store[q]=s
              print('STATEMENT_HASH_MATCH',q,actual)
          Path('/tmp/r9c_statements.json').write_text(json.dumps(store,ensure_ascii=False))
          PY

      - name: Generate at most one minimal sanitized-verdict correction
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,re,time,urllib.request
          from pathlib import Path

          prereg=json.load(open('research/capability_upgrader_r9/R9C_PREREG.json'))
          statements=json.load(open('/tmp/r9c_statements.json'))
          w0=json.load(open('frozen_w0/r9c_w0_outputs.json'))
          fq=json.load(open('r9c_failure_queue.json'))
          prior={r['task_id']:r for r in w0['records']}
          template=prereg['arms']['V1_MINIMAL_VERIFIER_CORRECTION']['prompt_template']

          def sha(s): return hashlib.sha256(s.encode()).hexdigest()
          def extract(raw):
              text=raw.strip()
              m=re.search(r'```(?:python3?|py)?\s*\n(.*?)```',text,re.I|re.S)
              code=(m.group(1) if m else text).strip()
              lines=code.splitlines()
              if lines and lines[0].strip().lower() in ('python','python3'):
                  code='\n'.join(lines[1:]).strip()
              return code

          records=[]
          for item in fq['failures']:
              q=item['task_id']
              v=item['verdict']
              feedback=template.replace('<VERDICT>',v)
              prompt=feedback+'\n\nORIGINAL PROBLEM:\n'+statements[q]+'\n\nPREVIOUS SUBMISSION:\n'+prior[q]['extracted_code']
              payload={
                'messages':[{'role':'user','content':prompt}],
                'temperature':0,
                'max_tokens':768,
                'chat_template_kwargs':{'enable_thinking':False},
              }
              req=urllib.request.Request(
                'http://127.0.0.1:8080/v1/chat/completions',
                data=json.dumps(payload).encode(),
                headers={'Content-Type':'application/json'},
              )
              started=time.time()
              with urllib.request.urlopen(req,timeout=180) as r:
                  data=json.load(r)
              raw=data['choices'][0]['message']['content']
              code=extract(raw)
              elapsed=time.time()-started
              usage=data.get('usage',{})
              rec={
                'task_id':q,
                'arm':'V1_MINIMAL_VERIFIER_CORRECTION',
                'verifier_feedback':v,
                'prompt_sha256':sha(prompt),
                'previous_code_sha256':prior[q]['code_sha256'],
                'raw_output':raw,
                'extracted_code':code,
                'raw_output_sha256':sha(raw),
                'code_sha256':sha(code),
                'generation_seconds':elapsed,
                'completion_tokens':usage.get('completion_tokens'),
              }
              records.append(rec)
              print('V1_GEN',q,v,'SEC=%.3f'%elapsed,'TOKENS='+str(rec['completion_tokens']),'CODE_SHA='+rec['code_sha256'])

          out={
            'schema':'triaxis.r9c.v1_raw_outputs_recovery/v1',
            'source_w0_run_id':31736489210,
            'source_w0_json_sha256':'41509199b23c44a995a8fc780b37c9132cb4ea589fad92f5ac5046ce4980ef3f',
            'feedback_fields':['sanitized_verdict_class'],
            'max_corrections':1,
            'hidden_test_content_disclosed':False,
            'records':records,
          }
          Path('r9c_v1_outputs.json').write_text(json.dumps(out,ensure_ascii=False,indent=2,sort_keys=True)+'\n')
          print('R9C_V1_OUTPUT_SHA256='+hashlib.sha256(Path('r9c_v1_outputs.json').read_bytes()).hexdigest())
          PY

      - name: Freeze V1 outputs before re-verification
        uses: actions/upload-artifact@v4
        with:
          name: r9c-recovery-v1-raw-outputs
          path: r9c_v1_outputs.json
          if-no-files-found: error
          retention-days: 30

      - name: Fresh native reverify and paired adjudication
        env:
          LCB_REPO: ./LiveCodeBench
          LCB_COMMIT: 28fef95ea8c9f7a547c8329f2cd3d32b92c1fa24
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,pathlib,sys
          tasks=['abc361_f','abc325_e','abc376_e','abc389_d','abc354_b','abc400_b']
          rows=json.load(open('/tmp/r9c_release_v6_rows.json'))
          w0r=json.load(open('r9c_w0_native_result.json'))
          v1=json.load(open('r9c_v1_outputs.json'))
          w0o=json.load(open('frozen_w0/r9c_w0_outputs.json'))
          w0={r['task_id']:r for r in w0r['results']}
          v1codes={r['task_id']:r['extracted_code'] for r in v1['records']}

          sys.path.insert(0,str(pathlib.Path(os.environ['LCB_REPO']).resolve()))
          from lcb_runner.benchmarks.code_generation import CodeGenerationProblem
          from lcb_runner.evaluation.compute_code_generation_metrics import check_correctness

          def flat(v):
              out=[]
              def walk(x):
                  if isinstance(x,(list,tuple)):
                      for z in x: walk(z)
                  else: out.append(x)
              walk(v)
              return out

          def verdict(v):
              if v and all(x is True or x==1 for x in v): return 'PASS'
              if any(x==-3 for x in v): return 'TLE'
              if any(x==-4 for x in v): return 'RE'
              if any(x==-2 for x in v): return 'WA'
              if any(x==-1 for x in v): return 'CE_OR_TIMEOUT'
              return 'FAIL'

          v1res=[]
          for q,code in v1codes.items():
              problem=CodeGenerationProblem(**rows[q])
              sample=problem.get_evaluation_sample()
              rl,_meta=check_correctness(sample,code,timeout=6,debug=False)
              vals=flat(rl)
              total=len(vals)
              passed=sum(1 for x in vals if x is True or x==1)
              v=verdict(vals)
              reward=1.0 if total and passed==total else 0.0
              v1res.append({'task_id':q,'reward':reward,'passed':passed,'total':total,'verdict':v})
              print('V1_SCORE',q,v,str(passed)+'/'+str(total))

          v1map={r['task_id']:r for r in v1res}
          paired=[]
          rescues=0
          unchanged_failures=0
          for q in tasks:
              base=w0[q]
              if base['reward']==1.0:
                  paired.append({
                    'task_id':q,
                    'w0':'PASS',
                    'v1_policy':'NOT_INVOKED_W0_PASS',
                    'final':'PASS',
                    'transition':'UNCHANGED_PASS',
                  })
              else:
                  corr=v1map[q]
                  if corr['reward']==1.0:
                      rescues += 1
                      transition='RESCUE'
                  else:
                      unchanged_failures += 1
                      transition='UNCHANGED_FAILURE'
                  paired.append({
                    'task_id':q,
                    'w0':base['verdict'],
                    'v1_policy':corr['verdict'],
                    'final':'PASS' if corr['reward']==1.0 else corr['verdict'],
                    'transition':transition,
                  })

          w0_tokens=sum((r.get('completion_tokens') or 0) for r in w0o['records'])
          w0_sec=sum(float(r.get('generation_seconds') or 0) for r in w0o['records'])
          v1_tokens=sum((r.get('completion_tokens') or 0) for r in v1['records'])
          v1_sec=sum(float(r.get('generation_seconds') or 0) for r in v1['records'])
          w0_pass=sum(1 for r in w0.values() if r['reward']==1.0)
          final_pass=w0_pass+rescues
          candidate_positive=(rescues>=1)

          out={
            'schema':'triaxis.r9c.final_result_recovery/v1',
            'source_model':'Qwen/Qwen3.5-0.8B',
            'source_revision':'2fc06364715b967f1860aea9cf38778875588b17',
            'source_w0_run_id':31736489210,
            'source_w0_json_sha256':'41509199b23c44a995a8fc780b37c9132cb4ea589fad92f5ac5046ce4980ef3f',
            'evoagentbench_release_version':'release_v6',
            'hf_dataset_revision':'503416f80ac447d31f252d8434023786ce45dd0c',
            'livecodebench_commit':os.environ['LCB_COMMIT'],
            'sample_total':len(tasks),
            'valid_denominator':len(tasks),
            'quarantined':[],
            'w0_pass':w0_pass,
            'final_policy_pass':final_pass,
            'rescues':rescues,
            'unchanged_failures':unchanged_failures,
            'selective_policy_harms':0,
            'harm_opportunities_on_w0_pass':0,
            'harm_note':'V1 is not invoked on W0 passes by preregistered selective policy; pass-to-fail harm is structurally prevented, not empirically estimated.',
            'paired':paired,
            'cost':{
              'w0_completion_tokens':w0_tokens,
              'additional_v1_completion_tokens':v1_tokens,
              'w0_generation_seconds':w0_sec,
              'additional_v1_generation_seconds':v1_sec,
            },
            'candidate_positive_smoke':candidate_positive,
            'promotion':'DENY_FROM_SMOKE_ALONE; fresh confirmatory replication required if candidate-positive',
            'hidden_test_content_disclosed':False,
            'ebrc_cognitive_lift_credit':0,
            'instrument_repair':'INCOMPLETE_TEST6_ONLY_BINDING_REPLACED_BY_CANONICAL_PINNED_RELEASE_V6_BEFORE_ANY_HIDDEN_VERDICT',
          }
          pathlib.Path('r9c_final_result.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print('===R9C_FINAL_RESULT_BEGIN===')
          print(json.dumps(out,indent=2,sort_keys=True))
          print('===R9C_FINAL_RESULT_END===')
          PY

      - name: Upload final R9-C recovery result
        uses: actions/upload-artifact@v4
        with:
          name: r9c-recovery-final-result
          path: r9c_final_result.json
          if-no-files-found: error
          retention-days: 30

      - name: Runtime tail
        if: always()
        run: tail -n 80 /tmp/llama.log || true
