name: RHE PR22 Ephemeral Validation

on:
  push:
    branches:
      - ci/rhe-risk-authority-r1-pr22-57bdeaa-validation

permissions:
  contents: read

jobs:
  deterministic-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src:.
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - name: Checkout exact CI branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deterministic test dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt pytest pyOpenSSL==26.4.0

      - name: Verify frozen authority and CI-only delta
        run: |
          git cat-file -e 57bdeaa2420e1f930f4df233e0a61346bf1a2b11^{commit}
          test "$(git diff --name-only 57bdeaa2420e1f930f4df233e0a61346bf1a2b11 HEAD)" = ".github/workflows/rhe-pr22-ephemeral-validation.yml"

      - name: Run bounded RHE Risk Authority suites
        run: |
          python -m pytest -q \
            tests/test_risk_authority_r1.py \
            tests/test_risk_mediation_r1.py \
            tests/test_authenticated_risk_mediation_runtime_binding_r1.py \
            tests/test_authenticated_risk_mediation_runtime_binding_testfix_r1.py \
            tests/test_authenticated_rhe_execution_boundary_r1.py \
            tests/test_v360_cryptographic_authenticity.py
